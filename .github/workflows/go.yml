name: Go

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Check out code
      uses: actions/checkout@v4

    - name: Install ThorVG dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build pkg-config

    - name: Cache ThorVG
      id: cache-thorvg
      uses: actions/cache@v3
      with:
        path: /usr/local
        key: ${{ runner.os }}-thorvg-0.11.0

    - name: Build and Install ThorVG
      if: steps.cache-thorvg.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch v0.11.0 https://github.com/thorvg/thorvg.git /tmp/thorvg
        cd /tmp/thorvg
        meson build
        sudo ninja -C build install
        sudo ldconfig

    - name: Get dependencies
      run: go mod download

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Run go vet
      run: go vet ./...

    - name: Run go fmt
      run: |
        gofmt -d .
        test -z "$(gofmt -l .)"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m
